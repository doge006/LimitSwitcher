name: macOS app

on:
  workflow_dispatch:  # manual only (Actions tab -> Run workflow), so it uses no minutes by itself
    inputs:
      job:
        description: "smoke: install from source on each macOS; dmg: build the DMGs and test one like a user (one runner)"
        type: choice
        options: [smoke, dmg]
        default: smoke
      os:
        description: "One runner (e.g. macos-15) to spend a third of the minutes; empty for all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.job == 'smoke'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["macos-15", "macos-26", "macos-latest"]') }}  # latest: the newest macOS GitHub offers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the universal launcher (scripts/mac_launcher, the installer's fallback)
        run: |
          clang -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2 -Wall -o /tmp/mac_launcher scripts/mac_launcher.c
          lipo -info /tmp/mac_launcher
          if ! cmp -s /tmp/mac_launcher scripts/mac_launcher; then cp /tmp/mac_launcher scripts/mac_launcher; fi
      - name: Install (the same script users run)
        run: |
          mkdir -p ~/.codex
          launchctl setenv ACCOUNT_SWITCHER_DEBUG 1
          sw_vers
          bash Install.command --skip-code
      - name: HTTPS from the app's Python (usage APIs)
        run: |
          .venv/bin/python3 -c "
          from account_switcher import providers
          try:
              providers._http('GET', providers.Claude.USAGE_URL, {'Authorization': 'Bearer invalid', 'anthropic-beta': 'oauth-2025-04-20'})
          except providers.ProviderError as error:
              print('usage API answered:', error)
              assert 'unreachable' not in str(error) and 'certificate' not in str(error), error
          "
      - name: Claude Code's status line command works (what the app wrote into settings.json)
        run: |
          sleep 8
          python3 - <<'PY'
          import json, os, subprocess, time
          # The app's line goes around a status line the person already has (or comes with the
          # Status mod): give Claude Code one, and the app (which checks settings.json every 20 s)
          # wraps it in its own.
          path = os.path.expanduser("~/.claude/settings.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          try:
              settings = json.load(open(path))
          except (OSError, ValueError):
              settings = {}
          settings["statusLine"] = {"type": "command", "command": "echo ci-own-line"}
          json.dump(settings, open(path, "w"))
          for _ in range(240):
              try:
                  settings = json.load(open(path))
              except (OSError, ValueError):
                  settings = {}
              if "account_switcher_statusline" in str(settings.get("statusLine")):
                  break
              time.sleep(0.25)
          else:
              raise SystemExit("the app did not take over the status line: " + json.dumps(settings.get("statusLine")))
          command = settings["statusLine"]["command"]
          print("command:", command)
          sample = json.dumps({"session_id": "ci", "rate_limits": {"five_hour": {"used_percentage": 12, "resets_at": time.time() + 3600}}})
          start = time.time()
          done = subprocess.run(["/bin/bash", "-c", command], input=sample, capture_output=True, text=True, timeout=20)
          print("exit:", done.returncode, "seconds:", round(time.time() - start, 2))
          print("stdout:", done.stdout[:300]); print("stderr:", done.stderr[:600])
          assert done.returncode == 0, "status line command failed"
          assert time.time() - start < 5, "status line command is slow"
          PY
          pgrep -fl "LimitSwitcher" || true
      - name: Smoke test
        run: |
          python3 -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet pyobjc-framework-Quartz
          /tmp/probe/bin/python .github/mac_smoke.py
      - name: Again with the prebuilt launcher (as when the Mac's build tools can't link)
        run: |
          bash Install.command --skip-code --prebuilt-launcher
          /tmp/probe/bin/python .github/mac_smoke.py
      - name: Keep the launcher build
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: mac-launcher
          path: /tmp/mac_launcher
          retention-days: 7
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: shots
          retention-days: 7
          if-no-files-found: ignore

  dmg:
    if: inputs.job == 'dmg'
    runs-on: macos-15  # Apple silicon
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/build_mac.py --arch arm64
          ls -la build/*.dmg
      - name: Install from the DMG with the README's command (scripts/install-mac.sh)
        run: |
          mkdir -p ~/.codex
          sw_vers
          hdiutil attach -nobrowse -mountpoint /tmp/dmg build/LimitSwitcher-AppleSilicon.dmg
          ls -la /tmp/dmg
          test -L /tmp/dmg/Applications  # for dragging it to Applications instead
          hdiutil detach /tmp/dmg
          touch /tmp/installed  # ditto keeps the files' times, so anything newer was written by the app
          launchctl setenv LIMITSWITCH_PANEL_TEST 1  # opens, moves and docks the panel (no clicks on a runner)
          bash scripts/install-mac.sh --dmg build/LimitSwitcher-AppleSilicon.dmg
          url="$HOME/Library/Application Support/LimitSwitcher/running.url"
          for i in $(seq 1 80); do [ -f "$url" ] && break; sleep 0.25; done
          if [ ! -f "$url" ]; then cat "$HOME/Library/Application Support/LimitSwitcher/app.log"; exit 1; fi
          ps axww -o pid,rss,comm,args | grep -i limitswitch | grep -v grep
      - name: Claude Code's status line command works (the bundle's own Python)
        run: |
          sleep 8
          python3 - <<'PY'
          import json, os, subprocess, time
          # The app's line goes around a status line the person already has (or comes with the
          # Status mod): give Claude Code one, and the app (which checks settings.json every 20 s)
          # wraps it in its own.
          path = os.path.expanduser("~/.claude/settings.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          try:
              settings = json.load(open(path))
          except (OSError, ValueError):
              settings = {}
          settings["statusLine"] = {"type": "command", "command": "echo ci-own-line"}
          json.dump(settings, open(path, "w"))
          for _ in range(240):
              try:
                  settings = json.load(open(path))
              except (OSError, ValueError):
                  settings = {}
              if "account_switcher_statusline" in str(settings.get("statusLine")):
                  break
              time.sleep(0.25)
          else:
              raise SystemExit("the app did not take over the status line: " + json.dumps(settings.get("statusLine")))
          command = settings["statusLine"]["command"]
          print("command:", command)
          assert "/Applications/LimitSwitcher.app/" in command, "not the bundle's Python"
          sample = json.dumps({"session_id": "ci", "rate_limits": {"five_hour": {"used_percentage": 12, "resets_at": time.time() + 3600}}})
          done = subprocess.run(["/bin/bash", "-c", command], input=sample, capture_output=True, text=True, timeout=20)
          print("exit:", done.returncode, "stdout:", done.stdout[:300], "stderr:", done.stderr[:600])
          # No accounts on the runner, so the app has no line to add; this checks the bundle's Python runs it.
          assert done.returncode == 0 and not done.stderr.strip(), "status line command failed"
          PY
      - name: The docs' measuring snippet works
        run: |
          snippet=$(python3 - <<'PY'
          import re
          text = open("docs/performance.md").read()
          match = re.search(r"```sh\n(pids=.*?)```", text, re.S)
          print(match.group(1).replace("sleep 60", "sleep 5").replace("/60*100", "/5*100"))
          PY
          )
          [ -n "$snippet" ] || { echo "no snippet in docs/performance.md"; exit 1; }
          out=$(bash -c "$snippet")
          echo "$out"
          echo "$out" | grep -q "MB memory"
      - name: The menu bar panel opens, moves away and docks again
        run: |
          sleep 4
          screencapture -x /tmp/panel.png || true
          mkdir -p shots && cp /tmp/panel.png shots/0-panel.png || true
          log="$HOME/Library/Application Support/LimitSwitcher/app.log"
          grep "panel test" "$log"
          python3 - "$log" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          def frame(name):
              m = re.search(r"panel test: " + name + r" \(([-\d]+), ([-\d]+), (\d+), (\d+)\)", text)
              assert m, "no '%s' line in app.log" % name
              return tuple(int(v) for v in m.groups())
          docked, moved, again = frame("docked"), frame("moved"), frame("docked again")
          assert docked[3] > 150, "the panel is too short: %s" % (docked,)
          assert "visible=True" in text.split("panel test: docked")[1].split("\n")[0], "not visible"
          # Detached, it loses the arrow (10 pt) at the top; the page stays where it was.
          assert moved[:2] == (docked[0] - 300, docked[1] - 200) and "detached=True" in text, "it didn't move"
          assert moved[3] == docked[3] - 10, "detached, the panel should lose just the arrow: %s %s" % (docked, moved)
          assert again[:2] == docked[:2] and "detached=False visible=True" in text, "it didn't dock back"
          assert "full view drawn=True" in text, "the full view didn't draw"
          assert "Traceback" not in text, "errors in app.log"
          print("page load:", re.findall(r"page drew in [\d.]+ s|the page took over 1.5 s", text))
          print("PASS panel: docked", docked, "moved", moved, "docked again", again)
          PY
          launchctl unsetenv LIMITSWITCH_PANEL_TEST
      - name: Memory (footprint, as Activity Monitor counts it)
        run: |
          pid=$(pgrep -fl 'MacOS/LimitSwitcher' | grep -v -- --full-view | head -1 | cut -d' ' -f1)
          echo "== the menu bar app, after the panel test (the full view is open in its own process) =="
          footprint -p $pid | head -22
          url="$HOME/Library/Application Support/LimitSwitcher/running.url"
          echo "== the full view's own process =="
          pgrep -fl 'MacOS/LimitSwitcher'
          full=$(pgrep -f 'MacOS/LimitSwitcher --full-view' | head -1)
          [ -n "$full" ] && [ "$full" != "$pid" ] || { echo "the full view isn't a process of its own"; exit 1; }
          footprint -p $full | grep "Footprint:"
          osascript -e 'tell application "Finder" to activate' || true
          sleep 2
          pgrep -f 'MacOS/LimitSwitcher --full-view' >/dev/null || { echo "switching apps closed the full view"; exit 1; }
          # Its close button, as a user would (System Events); the process ends with the window.
          osascript -e "tell application \"System Events\" to tell (first process whose unix id is $full) to click button 1 of window 1" \
            || { echo "no UI scripting here: ending it instead"; kill $full; }
          sleep 12  # the menu bar app's own cleanup runs 5 s after its panel closed
          if pgrep -f 'MacOS/LimitSwitcher --full-view'; then echo "the full view's process didn't end"; pgrep -fl 'MacOS/LimitSwitcher'; exit 1; fi
          echo "== idle: full view and panel closed =="
          footprint -p $pid | head -22
          python3 - "$pid" <<'PY'
          import re, subprocess, sys
          out = subprocess.run(["footprint", "-p", sys.argv[1]], capture_output=True, text=True).stdout
          mb = float(re.search(r"Footprint:\s+([\d.]+) MB", out).group(1))
          print("menu bar app idle:", mb, "MB")
          assert mb < 60, "the menu bar app uses %s MB idle" % mb
          PY
          vmmap --summary $pid | grep -E "^(Malloc|CG Image|IOSurface|WebKit|TOTAL)" || true
      - name: Where the memory goes (scripts/mac_memory.py, with the app's own Python)
        run: /Applications/LimitSwitcher.app/Contents/Resources/runtime/bin/python3 -B scripts/mac_memory.py
      - name: The full view drawn natively vs with Pillow (images in the screenshots artifact)
        run: /Applications/LimitSwitcher.app/Contents/Resources/runtime/bin/python3 -B scripts/compare_native.py shots
      - name: Smoke test (menu bar icon, window, quit)
        run: |
          python3 -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet pyobjc-framework-Quartz
          SMOKE_WINDOW_CLOSED=1 LIMITSWITCH_URL_FILE="$HOME/Library/Application Support/LimitSwitcher/running.url" /tmp/probe/bin/python .github/mac_smoke.py
      - name: The bundle is unchanged after running (its signature still holds)
        run: |
          codesign --verify --deep --strict /Applications/LimitSwitcher.app
          if find /Applications/LimitSwitcher.app -newer /tmp/installed -type f | grep .; then
            echo "files written inside the app"; exit 1
          fi
      - name: Keep the DMGs
        uses: actions/upload-artifact@v4
        with:
          name: LimitSwitcher-mac
          path: build/*.dmg
          retention-days: 14
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-dmg
          path: shots
          retention-days: 7
          if-no-files-found: ignore
