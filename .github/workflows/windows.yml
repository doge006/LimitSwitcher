name: Windows app

on:
  workflow_dispatch:  # manual only (Actions tab -> Run workflow), so it uses no minutes by itself
    inputs:
      job:
        description: "smoke: the smoke test on Windows 10 and 11. profile: where CPU and memory go (account_switcher/profiler.py). frames: animation frames, this commit against base"
        type: choice
        options: [smoke, profile, frames]
        default: smoke
      base:
        description: "frames: the commit or branch to compare against"
        type: string
        default: main

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.job != 'profile'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]  # Windows 10 and Windows 11 style taskbars
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install (the installer users run, without starting the app)
        run: |
          New-Item -ItemType Directory -Force "$HOME\.codex" | Out-Null
          python scripts/installer.py --skip-code --no-launch
      - name: Start the app with its full view
        run: Start-Process -FilePath .venv\Scripts\pythonw.exe -ArgumentList "LimitSwitcher.pyw","--show" -WorkingDirectory $PWD
      - name: Smoke test
        run: .venv\Scripts\python.exe .github\win_smoke.py
      - name: Separate accounts per window (the claude wrapper, 1.3.x folders, finding a window, the tests)
        run: .venv\Scripts\python.exe .github\win_perwindow.py
      - name: Updating replaces a copy it can't reach (its URL file is gone)
        run: |
          Start-Process -FilePath .venv\Scripts\pythonw.exe -ArgumentList "LimitSwitcher.pyw" -WorkingDirectory $PWD
          Start-Sleep 8
          Remove-Item .runtime\tray.url -ErrorAction SilentlyContinue
          python scripts/installer.py --skip-code
          Start-Sleep 3
          $all = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'python*' -and $_.CommandLine -match 'LimitSwitcher[.]pyw' })
          $all | ForEach-Object { "$($_.ProcessId) <- $($_.ParentProcessId): $($_.CommandLine)" }
          # A venv's pythonw.exe starts the real Python as its child: one app, two processes.
          $ids = $all | ForEach-Object { $_.ProcessId }
          $left = @($all | Where-Object { $ids -notcontains $_.ParentProcessId })
          $log = Get-Content "$env:LOCALAPPDATA\LimitSwitcher\app.log" -Tail 5
          $log
          if ($left.Count -ne 1) { throw "expected one running copy, found $($left.Count)" }
          if (-not ($log -match 'started, version')) { throw "the new copy did not start" }
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: shots
          retention-days: 7
          if-no-files-found: ignore


  frames:
    if: inputs.job == 'frames'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Requirements
        run: python -m pip install --quiet --disable-pip-version-check -r requirements-native.txt
      - name: Frames, base and this commit, taking turns
        env:
          BASE: ${{ inputs.base }}
        run: |
          $ref = if (git rev-parse --verify --quiet "origin/$env:BASE") { "origin/$env:BASE" } else { $env:BASE }
          git worktree add --detach ..\base $ref
          if ($LASTEXITCODE) { throw "no such base: $env:BASE" }
          foreach ($i in 1..3) {
            python -B .github\win_frames.py --root ..\base --out "before$i.json" | Out-Null
            python -B .github\win_frames.py --root . --out "after$i.json" | Out-Null
          }
          $table = python -B .github\win_frames.py --compare before1.json,before2.json,before3.json after1.json,after2.json,after3.json
          $table
          "## Animation frames: $env:BASE (before) and this commit (after)`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $table | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: "*.json"
          retention-days: 7
          if-no-files-found: ignore

  profile:
    if: inputs.job == 'profile'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Requirements
        run: python -m pip install --quiet --disable-pip-version-check -r requirements-native.txt
      - name: Measure (demo accounts, taskbar view on), then profile
        run: |
          $pythonw = Join-Path (Split-Path (Get-Command python).Source) 'pythonw.exe'
          function Sample([int]$seconds, [scriptblock]$during) {
            $ids = (Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'LimitSwitcher.exe' -or $_.CommandLine -match 'LimitSwitcher[.]pyw' }).ProcessId
            $before = (Get-Process -Id $ids | Measure-Object CPU -Sum).Sum
            $end = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $end) { & $during }
            $p = Get-Process -Id $ids
            '{0:N1} MB memory ({1:N1} MB private), {2:N2}% of one CPU core' -f (($p | Measure-Object WorkingSet64 -Sum).Sum / 1MB),
                (($p | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB), ((($p | Measure-Object CPU -Sum).Sum - $before) / $seconds * 100)
          }
          function Churn([int]$every) {
            $n = Start-Process notepad -PassThru; Start-Sleep -Milliseconds ($every * 600)
            Stop-Process -Id $n.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Milliseconds ($every * 400)
          }
          foreach ($profiled in $false, $true) {
            if ($profiled) {
              Write-Host "`n==== With the profiler (its own sampling costs a little; numbers above are without it) ===="
              $env:LIMITSWITCH_PROFILE = "$PWD\profile.txt"; $env:LIMITSWITCH_TRACEMALLOC = '1'
            } else {
              Write-Host "==== Without the profiler ===="
            }
            Remove-Item .runtime\tray.url -ErrorAction SilentlyContinue
            Start-Process -FilePath $pythonw -ArgumentList 'LimitSwitcher.pyw', '--demo' -WorkingDirectory $PWD
            foreach ($i in 1..80) { if (Test-Path .runtime\tray.url) { break }; Start-Sleep -Milliseconds 250 }
            Start-Sleep 35  # start-up done, and memory handed back after it (30 s)
            $base, $token = (Get-Content .runtime\tray.url -Raw).Trim() -split '/#token='
            $auth = @{ Authorization = "Bearer $token" }
            Write-Host ("Idle, 60 s:                     " + (Sample 60 { Start-Sleep 1 }))
            Write-Host ("A window every 5 s, 60 s:       " + (Sample 60 { Churn 5 }))
            Write-Host ("A window every 2 s, 60 s:       " + (Sample 60 { Churn 2 }))
            Invoke-RestMethod -Method Post -Uri "$base/api/show" -Headers $auth -ContentType 'application/json' -Body '{}' | Out-Null
            Write-Host ("Full view open, 30 s:           " + (Sample 30 { Start-Sleep 1 }))
            $closed = @(Select-String -Path "$env:LOCALAPPDATA\LimitSwitcher\app.log" -Pattern 'full view: closed').Count
            python -c "import ctypes; u = ctypes.windll.user32; h = u.FindWindowW('AccountSwitcherFullView', None); print('full view window', h); print('close posted', bool(h and u.PostMessageW(h, 0x10, 0, 0)))"
            Start-Sleep 8
            if (@(Select-String -Path "$env:LOCALAPPDATA\LimitSwitcher\app.log" -Pattern 'full view: closed').Count -le $closed) { throw 'the full view did not close' }
            Write-Host ("Idle again after closing, 30 s: " + (Sample 30 { Start-Sleep 1 }))
            Invoke-RestMethod -Method Post -Uri "$base/api/shutdown" -Headers $auth -ContentType 'application/json' -Body '{}' | Out-Null
            foreach ($i in 1..40) { if (-not (Test-Path .runtime\tray.url)) { break }; Start-Sleep -Milliseconds 250 }
            Start-Sleep 2
          }
          Get-Content profile.txt
          Get-Content "$env:LOCALAPPDATA\LimitSwitcher\app.log" -ErrorAction SilentlyContinue
          if (Select-String -Path "$env:LOCALAPPDATA\LimitSwitcher\app.log" -Pattern 'Traceback|ERROR' -Quiet) { throw 'errors in app.log' }
