name: Release

# Builds LimitSwitcher-Setup.exe, tests it (installs silently, the app starts and its full view
# opens, installing again over the running copy works, the uninstaller removes it), builds the
# macOS DMGs and tests the Apple silicon one through scripts/install-mac.sh (the README's install
# command), then publishes all three as release v<version> (account_switcher/version.py).
# The Windows steps wait with WaitForExit on the installer itself: Start-Process -Wait would also wait for the app it starts.
on:
  workflow_dispatch:  # manual only
    inputs:
      publish:
        description: "Publish the release (off: build and test only)"
        type: boolean
        default: true
      prerelease:
        description: "As a pre-release for testing (tag v<version>-test.<run number>; the app's update check skips it)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer
        run: ./scripts/build_windows.ps1
      - name: Install silently and run it (demo accounts)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Installed LimitSwitcher'
          (Start-Process -PassThru -FilePath build\LimitSwitcher-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", '/TASKS=startmenu').WaitForExit()
          if (-not (Test-Path "$dir\LimitSwitcher.exe")) { throw 'the exe was not installed' }
          if (-not (Test-Path "$dir\unins000.exe")) { throw 'no uninstaller' }
          # A silent install starts the app in the tray; close it and start it in demo mode instead.
          $url = "$dir\.runtime\tray.url"
          foreach ($i in 1..80) { if (Test-Path $url) { break }; Start-Sleep -Milliseconds 250 }
          & "$dir\runtime\python.exe" "$dir\LimitSwitcher.pyw" --quit
          foreach ($i in 1..80) { if (-not (Test-Path $url)) { break }; Start-Sleep -Milliseconds 250 }  # the old copy is gone
          Start-Process -FilePath "$dir\LimitSwitcher.exe" -ArgumentList '--demo', '--show'
          foreach ($i in 1..80) { if (Test-Path $url) { break }; Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $url)) { throw 'the app did not start' }
          Start-Sleep 4
          python .github/release_check.py $dir
      - name: Install again over a running copy (what an update does)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Installed LimitSwitcher'
          Start-Process -FilePath "$dir\LimitSwitcher.exe"
          $url = "$dir\.runtime\tray.url"
          foreach ($i in 1..80) { if (Test-Path $url) { break }; Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $url)) { throw 'the app did not start' }
          $before = (Get-Content $url -Raw).Trim()
          # Claude Code runs the status line script and the Auto resume hook with the app's own Python;
          # a waiting hook holds the runtime's files. The installer ends those, and no other Python.
          # (one argument string: Start-Process joins a list without quoting it)
          $hook = Start-Process -PassThru -WindowStyle Hidden -FilePath "$dir\runtime\python.exe" -ArgumentList '-c "import time; time.sleep(600)"'
          $other = Start-Process -PassThru -WindowStyle Hidden -FilePath (Get-Command python).Source -ArgumentList '-c "import time; time.sleep(600)"'
          Start-Sleep -Seconds 2
          if (-not (Get-Process -Id $hook.Id -ErrorAction SilentlyContinue) -or -not (Get-Process -Id $other.Id -ErrorAction SilentlyContinue)) { throw 'the test Pythons did not start' }
          $setup = Start-Process -PassThru -FilePath build\LimitSwitcher-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\update-install.log`""
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\update-install.log" -Tail 40; throw "the update failed (exit code $($setup.ExitCode))" }
          if (Get-Process -Id $hook.Id -ErrorAction SilentlyContinue) { throw "the app's own Python (a hook) was left running" }
          if (-not (Get-Process -Id $other.Id -ErrorAction SilentlyContinue)) { throw 'another Python was ended too' }
          Stop-Process -Id $other.Id -Force
          Write-Host "PASS the installer ended the app's own Python only"
          foreach ($i in 1..80) { if ((Test-Path $url) -and (Get-Content $url -Raw).Trim() -ne $before) { break }; Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $url) -or (Get-Content $url -Raw).Trim() -eq $before) { throw 'the app was not restarted after the update' }
          $running = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'LimitSwitcher.exe' })
          Write-Host "PASS updated in place and started again ($($running.Count) process(es))"
          # The app's own setting (on at first run) writes the entry once it has started.
          foreach ($i in 1..60) {
            $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name LimitSwitcher -ErrorAction SilentlyContinue).LimitSwitcher
            if ($run) { break }; Start-Sleep -Milliseconds 250
          }
          if (-not $run) {
            Get-Content "$env:LOCALAPPDATA\LimitSwitcher\app.log" -ErrorAction SilentlyContinue
            Get-Item 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue | Format-List
            throw 'start at sign-in was not set'
          }
          if ($run -notmatch 'LimitSwitcher[.]exe') { throw "start at sign-in runs '$run', not LimitSwitcher.exe" }
          Write-Host "PASS start at sign-in: $run"
      - name: The README's measuring snippet works
        run: |
          # The Windows snippet from README.md (Performance), sampling 5 s instead of 60.
          $readme = Get-Content README.md -Raw
          $snippet = [regex]::Match($readme, '(?s)```powershell\r?\n(\$before = .*?)```').Groups[1].Value
          if (-not $snippet) { throw 'no snippet in README.md' }
          $out = Invoke-Expression ($snippet -replace 'Start-Sleep 60', 'Start-Sleep 5' -replace '/ 60 \* 100', '/ 5 * 100')
          Write-Host $out
          if ($out -notmatch 'MB memory') { throw 'the snippet printed nothing useful' }
      - name: Uninstall
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Installed LimitSwitcher'
          # The uninstaller hands over to a copy of itself in %TEMP%: wait for its files to go.
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          foreach ($i in 1..120) { if (-not (Test-Path "$dir\unins000.exe")) { break }; Start-Sleep -Milliseconds 500 }
          Start-Sleep 2
          if (Test-Path "$dir\LimitSwitcher.exe") { throw 'the exe is still there' }
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'LimitSwitcher.exe' -or ($_.Name -like 'python*' -and $_.CommandLine -match 'LimitSwitcher[.]pyw') })
          if ($left.Count) { throw 'the app is still running' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name LimitSwitcher -ErrorAction SilentlyContinue) { throw 'start at sign-in was left behind' }
          $link = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LimitSwitcher.lnk'
          if (Test-Path $link) { throw 'the Start menu shortcut was left behind' }
          Write-Host 'PASS uninstalled cleanly'
      - uses: actions/upload-artifact@v4
        with:
          name: LimitSwitcher-Setup
          path: build/LimitSwitcher-Setup.exe
          retention-days: 7
      - name: Test builds only - the installer packed other ways, and the launcher alone, to compare antivirus verdicts
        if: ${{ !inputs.publish }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $version = (python -c "import sys; sys.path.insert(0, '.'); from account_switcher.version import VERSION; print(VERSION)").Trim()
          New-Item -ItemType Directory -Force build\av | Out-Null
          Copy-Item build\LimitSwitcher\LimitSwitcher.exe build\av\LimitSwitcher.exe
          foreach ($v in @(@('zip', 'no'), @('lzma2/max', 'no'), @('none', 'no'))) {
            $name = 'Setup-' + ($v[0] -replace '[^a-z0-9]', '') + '-solid' + $v[1]
            & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path build\LimitSwitcher).Path)" "/O$((Resolve-Path build\av).Path)" "/F$name" "/DCompress=$($v[0])" "/DSolid=$($v[1])" scripts\LimitSwitcher.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $name" }
          }
          Get-ChildItem build\av | ForEach-Object { '{0} {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: av-variants
          path: build/av
          retention-days: 3

  macos:
    runs-on: macos-15  # Apple silicon (the Mac release is Apple silicon only)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/build_mac.py --arch arm64
      - name: Install with the README's command (from this build's DMG), run it, install again over it
        run: |
          mkdir -p ~/.codex
          log="$HOME/Library/Application Support/LimitSwitcher/app.log"
          fail() { echo "FAIL $1"; echo "-- processes:"; pgrep -fl LimitSwitch || true; echo "-- app.log:"; tail -n 60 "$log" 2>/dev/null || true; exit 1; }
          bash scripts/install-mac.sh --dmg build/LimitSwitcher-AppleSilicon.dmg
          url="$HOME/Library/Application Support/LimitSwitcher/running.url"
          for i in $(seq 1 80); do [ -f "$url" ] && break; sleep 0.25; done
          [ -f "$url" ] || fail "the app did not start"
          before=$(cat "$url")
          pgrep -fl MacOS/LimitSwitcher
          bash scripts/install-mac.sh --dmg build/LimitSwitcher-AppleSilicon.dmg
          for i in $(seq 1 80); do [ -f "$url" ] && [ "$(cat "$url")" != "$before" ] && break; sleep 0.25; done
          [ -f "$url" ] && [ "$(cat "$url")" != "$before" ] || fail "the app did not start again after the update"
          [ "$(pgrep -fl MacOS/LimitSwitcher | grep -vc -- --full-view)" = 1 ] || fail "not exactly one copy running"
          for i in $(seq 1 40); do grep -q account-switcher ~/.codex/config.toml 2>/dev/null && break; sleep 0.25; done
          grep -q account-switcher ~/.codex/config.toml || fail "Codex is not routed while running"
          /Applications/LimitSwitcher.app/Contents/Resources/runtime/bin/python3 -B \
            /Applications/LimitSwitcher.app/Contents/Resources/app/LimitSwitcher.pyw --quit
          for i in $(seq 1 40); do pgrep -f MacOS/LimitSwitcher >/dev/null || break; sleep 0.25; done  # the full view closes too
          ! pgrep -fl MacOS/LimitSwitcher || fail "quit left it running"
          ! grep -q account-switcher ~/.codex/config.toml || fail "quit left Codex routed"
          codesign --verify --deep --strict /Applications/LimitSwitcher.app
          echo "PASS installed, updated in place and quit cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: LimitSwitcher-mac
          path: build/*.dmg
          retention-days: 7

  publish:
    if: inputs.publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import sys; sys.path.insert(0, '.'); from account_switcher.version import VERSION; print(VERSION)")
          tag="v$v"; title="LimitSwitcher $v"; notes="--notes-file .github/release-notes.md"; extra=""
          if [ "${{ inputs.prerelease }}" = true ]; then
            tag="v$v-test.${{ github.run_number }}"; title="LimitSwitcher $v (test build ${{ github.run_number }})"; notes="--generate-notes"; extra="--prerelease"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released: bump VERSION in account_switcher/version.py"; exit 1; fi
          ls -la build
          gh release create "$tag" build/LimitSwitcher-Setup.exe build/LimitSwitcher-AppleSilicon.dmg \
            --title "$title" $notes --target "${{ github.sha }}" $extra
